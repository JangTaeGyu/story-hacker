<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1117"/>
      <stop offset="100%" style="stop-color:#161B22"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="0.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="url(#bg)"/>

  <!-- Border glow -->
  <rect x="1" y="1" width="30" height="30" rx="5" fill="none" stroke="#00FF88" stroke-width="1.5" opacity="0.6"/>

  <!-- Lock body -->
  <rect x="9" y="14" width="14" height="12" rx="2" fill="none" stroke="#00FF88" stroke-width="2" filter="url(#glow)"/>

  <!-- Lock shackle -->
  <path d="M12 14V10a4 4 0 0 1 8 0v4" fill="none" stroke="#00FF88" stroke-width="2" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Keyhole -->
  <circle cx="16" cy="19" r="1.5" fill="#00FF88"/>
  <rect x="15" y="19" width="2" height="4" fill="#00FF88"/>
</svg>
