      <stop offset="0" stop-color="#16140f"/>
      <stop offset="1" stop-color="#0c0b09"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- 희미한 골드 헤어라인 테두리 -->
